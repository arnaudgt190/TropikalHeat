<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'univers · Tropikal Heat</title>
<meta name="description" content="Tropikal Heat : archipel, culture, 971. Un streetwear pensé, dessiné et imprimé en Guadeloupe.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="univers">
<header id="header"></header>
<main>
<section class="page-head wrap">
  <p class="label" data-c="marque.baseline"></p>
  <h1 data-c="univers.titre"></h1>
  <p data-c="univers.intro"></p>
</section>

<section class="wrap">
  <div class="pillars reveal" data-list="univers.piliers">
    <template><article class="pillar"><h3 class="heat-text" data-f="titre"></h3><p data-f="texte"></p></article></template>
  </div>
</section>

<section class="section wrap split">
  <div class="print-card reveal"><img src="assets/embleme.svg" alt="Emblème Tropikal Heat" width="420" height="356" loading="lazy" style="width:min(360px,100%)"></div>
  <div class="reveal">
    <p class="label">L'emblème</p>
    <h2 class="gothic" style="font-size:clamp(2.4rem,5vw,3.8rem);margin:.6rem 0 1rem">Un soleil, une fleur.</h2>
    <p class="ed-text">Le soleil qui se lève sur l'archipel, et l'hibiscus qui pousse partout chez nous. Deux symboles simples, réunis dans un emblème qu'on retrouve sur chaque pièce.</p>
  </div>
</section>

<section class="manifesto wrap">
  <blockquote class="heat-text">Feel the heat.</blockquote>
  <cite data-c="univers.signature"></cite>
</section>
</main>
<footer id="footer"></footer>
<script src="js/content.js"></script>
<script src="js/main.js"></script>

</html>
