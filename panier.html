<body data-page="panier">
<header id="header"></header>
<main>
<section class="page-head wrap cart-head">
  <h1 data-initial>Mon panier</h1>
  <p id="cart-count-title"></p>
</section>

<div class="wrap cart-empty" id="cart-empty" hidden>
  <p>Ton panier est vide pour l'instant.</p>
  <a class="btn" href="karukera.html">Découvrir la boutique</a>
</div>

<div class="wrap cart" id="cart-full" hidden>
  <ul class="cart-list" id="cart-list"></ul>

  <aside class="cart-box" id="cart-box">
    <p class="launch" id="cart-launch" hidden></p>
    <p class="cart-line"><span>Sous-total</span><span id="subtotal"></span></p>
    <label class="opt-label" for="shipping">Livraison</label>
    <div class="select-wrap"><select id="shipping"></select></div>
    <p class="ship-note" id="ship-note"></p>
    <p class="total">Total : <span id="total"></span></p>
  </aside>

  <section class="preorder cart-order">
    <h2>Je précommande</h2>
    <p>Laisse tes coordonnées : je te recontacte très vite pour le paiement et la livraison. Les pièces partent aux premiers qui règlent.</p>
    <form class="po-form" id="po-form" novalidate>
      <label>Prénom et nom<input name="nom" required autocomplete="name"></label>
      <label>Téléphone<input name="telephone" type="tel" required autocomplete="tel"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Adresse de livraison<textarea name="adresse" rows="2" required autocomplete="street-address"></textarea></label>
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
      <button class="btn" type="submit">Envoyer ma précommande</button>
      <p class="form-msg" role="status" aria-live="polite"></p>
    </form>
  </section>
</div>
</main>
<footer id="footer"></footer>
<script src="js/content.js?v=20261126k"></script>
<script src="js/main.js?v=20261126k"></script>
</body>
</html>
