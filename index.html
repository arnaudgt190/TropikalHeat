<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tropikal Heat · Streetwear né en Guadeloupe, test</title>
<meta name="description" content="Tropikal Heat, streetwear né en Guadeloupe. Édition limitée KARUKERA. Feel the heat.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="accueil">
<header id="header"></header>
<main>
<section class="hero">
  <div class="sun-glow" aria-hidden="true"></div>
  <div class="hero-inner wrap">
    <p class="label" data-c="accueil.surtitre"></p>
    <img class="hero-emblem" src="assets/embleme.svg" alt="Emblème Tropikal Heat, soleil et hibiscus" width="320" height="271">
    <h1 class="hero-wm"><b>T</b>ropikal <b>H</b>eat</h1>
    <p class="hero-slogan heat-text" data-c="marque.slogan"></p>
    <p class="hero-text" data-c="accueil.texte"></p>
    <div class="hero-actions">
      <a class="btn" href="karukera.html" data-c="accueil.bouton"></a>
      <a class="btn ghost" href="univers.html">L'univers</a>
    </div>
  </div>
</section>

<div class="marquee" aria-hidden="true"><div class="marquee-track"></div></div>

<section class="section">
  <div class="wrap split">
    <div class="print-card reveal">
      <img src="assets/lookbook/dos-degrade-noir.webp" alt="Visuel du dos KARUKERA : soleil, corail, vague et hibiscus en dégradé" width="700" height="1014" loading="lazy">
    </div>
    <div class="reveal">
      <p class="ed-num" data-c="edition.numero"></p>
      <h2 class="ed-title heat-text" data-c="edition.nom"></h2>
      <p class="ed-hook" data-c="edition.accroche"></p>
      <p class="ed-text" data-c="edition.texte"></p>
      <a class="btn" href="karukera.html">Précommander</a>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="wrap">
    <p class="label reveal" data-c="marque.baseline"></p>
    <h2 class="gothic reveal" style="font-size:clamp(2.6rem,6vw,4.6rem);margin:.8rem 0 0;max-width:16ch" data-c="univers.titre"></h2>
    <div class="pillars reveal" data-list="univers.piliers">
      <template><article class="pillar"><h3 class="heat-text" data-f="titre"></h3><p data-f="texte"></p></article></template>
    </div>
  </div>
</section>
</main>
<footer id="footer"></footer>
<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
