<body data-page="contact">
<header id="header"></header>
<main>
<section class="page-head wrap">
  <h1 data-c="contact.titre" data-initial></h1>
  <p data-c="contact.texte"></p>
  <p class="contact-alt">Tu préfères Instagram ? <a class="btn ghost btn-sm" id="ig-dm" href="#" target="_blank" rel="noopener">Écris-moi en DM</a></p>
</section>

<form class="contact-box wrap" id="contact-form">
  <label>Ton prénom<input name="nom" required autocomplete="given-name"></label>
  <label>Ton email<input name="email" type="email" required autocomplete="email"></label>
  <label>Sujet<select name="sujet" id="sujet"></select></label>
  <label>Message<textarea name="message" required></textarea></label>
  <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
  <button class="btn" type="submit">Envoyer</button>
  <p class="form-msg" role="status" aria-live="polite"></p>
</form>
</main>
<footer id="footer"></footer>
