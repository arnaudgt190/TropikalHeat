<meta property="og:title" content="Boutique · KARUKERA Édition 01 · Tropikal Heat">

<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="edition">
<header id="header"></header>
<main>
<div class="wrap product">
  <div class="product-stage">
    <div class="carousel" data-carousel data-autoplay="false" id="product-car" role="region" aria-roledescription="carrousel" aria-label="Les t-shirts KARUKERA">
      <div class="car-track"></div>
      <span class="tag" data-c="edition.numero"></span>
      <button class="car-btn prev" type="button" aria-label="Voir le t-shirt précédent"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="car-btn next" type="button" aria-label="Voir le t-shirt suivant"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="car-dots" role="group" aria-label="Choisir un t-shirt"></div>
    </div>
  </div>
  <div>
    <p class="label" data-c="edition.accroche"></p>
    <h1 class="ed-title" data-c="edition.nom" data-initial></h1>
    <p class="ed-text" data-c="edition.texte"></p>
    <p class="price" id="price" data-c="edition.prix"></p>

    <p class="opt-label" id="lbl-variant">Couleur</p>
    <div id="variants" role="group" aria-labelledby="lbl-variant"></div>

    <p class="opt-label" id="lbl-size">Taille</p>
    <div id="sizes" role="group" aria-labelledby="lbl-size"></div>

    <label class="opt-label" for="shipping">Livraison</label>
    <div class="select-wrap"><select id="shipping"></select></div>
    <p class="ship-note" id="ship-note"></p>
    <p class="total">Total : <span id="total"></span></p>

    <div class="preorder">
      <h2 data-c="edition.precommande.titre"></h2>
      <p data-c="edition.precommande.texte"></p>
      <button class="btn" id="precommande" type="button">Je précommande</button>
      <p class="stock">Édition limitée à <span data-c="edition.stock"></span> pièces</p>
    </div>

    <ul class="details" data-list="edition.details"><template><li data-f="x"></li></template></ul>
  </div>
</div>
</main>
<footer id="footer"></footer>
<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
